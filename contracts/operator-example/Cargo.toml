[package]
name = "soroban-operator-example"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { version = "20.0.0" }

[dev-dependencies]
soroban-sdk = { version = "20.0.0", features = ["testutils"] }
soroban-subscription-contract = { path = "../subscription" }

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1
