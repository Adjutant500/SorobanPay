[package]
name = "soroban-subscription-contract"
version = "1.0.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
upgrade-test = []

[dependencies]
# Pin to the latest 20.x patch release to pick up any security fixes within
# the 20.x Soroban host interface generation.  A major-version bump requires
# re-validating against the matching Soroban host on testnet (see TEST-103).
soroban-sdk = { version = "20.5.0" }

[dev-dependencies]
soroban-sdk = { version = "20.5.0", features = ["testutils"] }
proptest = { version = "1.4", default-features = false, features = ["alloc"] }
proptest-derive = "0.4"
arbitrary = "=1.3.2"
derive_arbitrary = "=1.3.2"

[profile.release]
opt-level = "z"
overflow-checks = true
lto = true
codegen-units = 1
