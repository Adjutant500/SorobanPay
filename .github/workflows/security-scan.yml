name: Security Scan

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  # ── Rust: cargo audit ────────────────────────────────────────────────────────
  rust-audit:
    name: cargo audit (Rust)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/subscription

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        id: cargo_audit
        run: cargo audit --manifest-path contracts/subscription/Cargo.toml
        continue-on-error: true

      - name: Create GitHub issue on failure
        if: steps.cargo_audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            // Check if an open issue already exists to avoid duplicates
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['security'],
              state: 'open',
            });
            const title = `[Security] Rust dependency vulnerabilities detected (${date})`;
            const existing = issues.find(i => i.title.startsWith('[Security] Rust dependency vulnerabilities'));
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body: `🔄 Weekly scan on ${date} still finds vulnerabilities. Run \`cargo audit\` in \`contracts/subscription/\` to see details.`,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body: [
                  '## Rust dependency vulnerabilities detected',
                  '',
                  `The weekly \`cargo audit\` scan run on ${date} found advisory vulnerabilities in the smart contract dependencies.`,
                  '',
                  '**To investigate:**',
                  '```bash',
                  'cd contracts/subscription',
                  'cargo audit',
                  '```',
                  '',
                  '**To fix:** update the affected dependency in `Cargo.toml` and run `cargo update`.',
                  '',
                  `_Detected by [security-scan.yml](.github/workflows/security-scan.yml)_`,
                ].join('\n'),
                labels: ['security', 'bug'],
              });
            }

  # ── npm audit: frontend ──────────────────────────────────────────────────────
  npm-audit-frontend:
    name: npm audit (frontend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run npm audit
        id: npm_audit
        run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true

      - name: Create GitHub issue on failure
        if: steps.npm_audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['security'],
              state: 'open',
            });
            const existing = issues.find(i => i.title.startsWith('[Security] Frontend npm vulnerabilities'));
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[Security] Frontend npm vulnerabilities detected (${date})`,
                body: [
                  '## High/critical npm vulnerabilities in frontend',
                  '',
                  `Weekly \`npm audit\` scan on ${date} found high or critical severity vulnerabilities in \`frontend/\` dependencies.`,
                  '',
                  '**To investigate:**',
                  '```bash',
                  'cd frontend && npm audit',
                  '```',
                  '',
                  '**To fix:** run `npm audit fix` or update the affected packages manually.',
                  '',
                  `_Detected by [security-scan.yml](.github/workflows/security-scan.yml)_`,
                ].join('\n'),
                labels: ['security', 'bug', 'frontend'],
              });
            }

  # ── npm audit: backend ───────────────────────────────────────────────────────
  npm-audit-backend:
    name: npm audit (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Run npm audit
        id: npm_audit
        run: npm audit --audit-level=high
        working-directory: backend
        continue-on-error: true

      - name: Create GitHub issue on failure
        if: steps.npm_audit.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const date = new Date().toISOString().split('T')[0];
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['security'],
              state: 'open',
            });
            const existing = issues.find(i => i.title.startsWith('[Security] Backend npm vulnerabilities'));
            if (!existing) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: `[Security] Backend npm vulnerabilities detected (${date})`,
                body: [
                  '## High/critical npm vulnerabilities in backend',
                  '',
                  `Weekly \`npm audit\` scan on ${date} found high or critical severity vulnerabilities in \`backend/\` dependencies.`,
                  '',
                  '**To investigate:**',
                  '```bash',
                  'cd backend && npm audit',
                  '```',
                  '',
                  '**To fix:** run `npm audit fix` or update the affected packages manually.',
                  '',
                  `_Detected by [security-scan.yml](.github/workflows/security-scan.yml)_`,
                ].join('\n'),
                labels: ['security', 'bug', 'backend'],
              });
            }
