# deploy/k8s/secrets.yaml
#
# IMPORTANT: This file contains PLACEHOLDER values only.
# Never commit real secrets to source control.
#
# Production secret management options:
#   - External Secrets Operator (recommended): sync from AWS Secrets Manager,
#     GCP Secret Manager, or HashiCorp Vault. Replace this file with an
#     ExternalSecret manifest.
#   - Sealed Secrets: encrypt with `kubeseal`, commit the SealedSecret CRD.
#   - Direct kubectl: kubectl create secret generic sorobanpay-secrets \
#       --from-literal=DATABASE_URL="postgresql://..." \
#       --from-literal=WEBHOOK_SECRET="$(openssl rand -hex 32)" \
#       --from-literal=ADMIN_JWT_SECRET="$(openssl rand -hex 32)" \
#       -n sorobanpay
#
# Values below are base64-encoded placeholders (echo -n "placeholder" | base64).
# Replace each with the base64-encoded real value before applying.
apiVersion: v1
kind: Secret
metadata:
  name: sorobanpay-secrets
  namespace: sorobanpay
  labels:
    app.kubernetes.io/name: sorobanpay
    app.kubernetes.io/component: secrets
  annotations:
    # Remind operators that this file must not contain real values in SCM.
    sorobanpay.io/secret-store: "replace-with-external-secrets-or-sealed-secrets"
type: Opaque
data:
  # postgresql://<user>:<password>@<host>:<port>/<database>?schema=public
  # Example: echo -n "postgresql://sorobanpay:s3cur3@postgres:5432/sorobanpay?schema=public" | base64
  DATABASE_URL: cG9zdGdyZXNxbDovL3NvcW9iYW5wYXk6Q0hBTkdFX01FQHBvc3RncmVzOjU0MzIvc29yb2JhbnBheT9zY2hlbWE9cHVibGlj

  # Generate: openssl rand -hex 32
  WEBHOOK_SECRET: Q0hBTkdFX01FX1dFQkhPT0tfU0VDUkVU

  # Generate: openssl rand -hex 32
  ADMIN_JWT_SECRET: Q0hBTkdFX01FX0FETUlOX0pXVF9TRUNSRVQ=

  # SMTP credentials (leave empty if EMAIL_DRY_RUN=true)
  SMTP_USER: ""
  SMTP_PASS: ""

  # OPERATOR_SECRET: Stellar secret key (S…) for the PaymentScheduler.
  # Only required if you want the backend to auto-submit execute_payment txns.
  # Leave empty to disable the scheduler (recommended for most deployments).
  OPERATOR_SECRET: ""
