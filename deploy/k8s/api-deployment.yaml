# deploy/k8s/api-deployment.yaml
#
# REST API — serves merchant dashboard, subscription, webhook, admin, and
# reporting endpoints. Horizontally scalable; autoscaled by hpa.yaml.
#
# Topology notes:
#   - min 2 replicas (HA across availability zones)
#   - HPA scales up to 10 replicas at CPU ≥ 70% (see hpa.yaml)
#   - RollingUpdate with maxUnavailable=0 for zero-downtime deployments
#   - Exposed via ClusterIP + Ingress (see api-service.yaml)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sorobanpay-api
  namespace: sorobanpay
  labels:
    app.kubernetes.io/name: sorobanpay
    app.kubernetes.io/component: api
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/change-cause: "initial deployment"
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never reduce below the desired replica count during an update.
      maxUnavailable: 0
      # Allow one extra pod to be created during the rollout.
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sorobanpay
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sorobanpay
        app.kubernetes.io/component: api
        app.kubernetes.io/version: "1.0.0"
      annotations:
        checksum/config: "placeholder-update-via-kustomize"
        checksum/secret: "placeholder-update-via-kustomize"
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      # Spread replicas across availability zones and nodes for HA.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sorobanpay
              app.kubernetes.io/component: api
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: sorobanpay
              app.kubernetes.io/component: api
      containers:
        - name: api
          image: sorobanpay/backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            - name: SERVICE_ROLE
              value: "api"
          envFrom:
            - configMapRef:
                name: sorobanpay-config
            - secretRef:
                name: sorobanpay-secrets
          # ── Liveness probe ───────────────────────────────────────────────────
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          # ── Readiness probe ──────────────────────────────────────────────────
          # A pod is only sent traffic once /health returns 200.
          # This ensures a pod is never added to the load-balancer pool while
          # the DB connection or RPC check is still warming up.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          # ── Startup probe ────────────────────────────────────────────────────
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 12
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      nodeSelector:
        kubernetes.io/os: linux
