# deploy/k8s/api-service.yaml
#
# Service (ClusterIP) — exposes the API pods internally within the cluster.
# Ingress — routes external HTTPS traffic (TLS terminated at ingress) to the
# API service. Replace the hostname and the cert-manager issuer annotation
# before applying to production.
#
# Prerequisites:
#   - An Ingress controller installed (nginx-ingress recommended).
#     kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.1/deploy/static/provider/cloud/deploy.yaml
#   - cert-manager installed for automatic TLS certificates (Let's Encrypt).
#     kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.15.1/cert-manager.yaml
---
# ── ClusterIP Service ────────────────────────────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: sorobanpay-api
  namespace: sorobanpay
  labels:
    app.kubernetes.io/name: sorobanpay
    app.kubernetes.io/component: api
  annotations:
    # Prometheus ServiceMonitor-style annotation for prometheus-operator scraping.
    prometheus.io/scrape: "true"
    prometheus.io/port: "3001"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: sorobanpay
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
# ── Ingress ──────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sorobanpay-api
  namespace: sorobanpay
  labels:
    app.kubernetes.io/name: sorobanpay
    app.kubernetes.io/component: api
  annotations:
    # Use the nginx ingress controller.
    kubernetes.io/ingress.class: "nginx"
    # cert-manager: automatically provision a Let's Encrypt certificate.
    # Replace "letsencrypt-prod" with your ClusterIssuer name.
    # For staging/testing, use "letsencrypt-staging".
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    # Redirect all HTTP to HTTPS.
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Forward the real client IP via X-Forwarded-For
    # (matches RATE_LIMIT_TRUST_PROXY=true in the ConfigMap).
    nginx.ingress.kubernetes.io/use-forwarded-headers: "true"
    nginx.ingress.kubernetes.io/compute-full-forwarded-for: "true"
    # Enforce a request body size limit (protect against large payload attacks).
    nginx.ingress.kubernetes.io/proxy-body-size: "1m"
    # Proxy timeouts.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
    # CORS — adjust origins for your merchant dashboard domain.
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "https://app.sorobanpay.example.com"
    nginx.ingress.kubernetes.io/cors-allow-methods: "GET, POST, PUT, DELETE, OPTIONS"
    nginx.ingress.kubernetes.io/cors-allow-headers: "Authorization, Content-Type, X-Api-Key"
spec:
  tls:
    # Replace with your real domain. cert-manager will create the TLS secret.
    - hosts:
        - api.sorobanpay.example.com
      secretName: sorobanpay-api-tls
  rules:
    - host: api.sorobanpay.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: sorobanpay-api
                port:
                  name: http
