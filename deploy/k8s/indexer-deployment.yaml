# deploy/k8s/indexer-deployment.yaml
#
# Event Indexer — polls Soroban RPC every 5 minutes and persists events to
# PostgreSQL. Runs as a single replica (cron-driven, not HTTP-load-driven).
# The indexer uses the same Docker image as the API and webhook-worker;
# SERVICE_ROLE=indexer instructs the entrypoint to enable only indexer crons.
#
# Topology notes:
#   - 1 replica: the indexer uses a cursor-based RPC poll; running multiple
#     replicas simultaneously would cause duplicate insertions. If HA is
#     required, use a leader-election sidecar or a Kubernetes CronJob instead.
#   - No Ingress: indexer has no inbound HTTP traffic.
#   - /health probe: the /health route is available in all roles, enabling
#     Kubernetes to detect and restart a stuck container.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sorobanpay-indexer
  namespace: sorobanpay
  labels:
    app.kubernetes.io/name: sorobanpay
    app.kubernetes.io/component: indexer
    app.kubernetes.io/version: "1.0.0"
  annotations:
    kubernetes.io/change-cause: "initial deployment"
spec:
  replicas: 1
  # Recreate ensures only one indexer pod is active at any time during updates.
  # This prevents the brief dual-write window that RollingUpdate would create.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: sorobanpay
      app.kubernetes.io/component: indexer
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sorobanpay
        app.kubernetes.io/component: indexer
        app.kubernetes.io/version: "1.0.0"
      annotations:
        # Cause a rollout whenever the ConfigMap or Secret checksum changes.
        # Update these hashes via Kustomize or your CI pipeline.
        checksum/config: "placeholder-update-via-kustomize"
        checksum/secret: "placeholder-update-via-kustomize"
        prometheus.io/scrape: "true"
        prometheus.io/port: "3001"
        prometheus.io/path: "/metrics"
    spec:
      # Allow up to 60s for graceful shutdown so in-flight DB writes complete.
      terminationGracePeriodSeconds: 60
      # Run as a non-root user for security hardening.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: indexer
          image: sorobanpay/backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3001
              protocol: TCP
          env:
            # Role selector — tell the entrypoint to run in indexer mode.
            - name: SERVICE_ROLE
              value: "indexer"
          # Load all non-secret config from the ConfigMap.
          envFrom:
            - configMapRef:
                name: sorobanpay-config
            - secretRef:
                name: sorobanpay-secrets
          # ── Liveness probe ───────────────────────────────────────────────────
          # Restarts the container if the health endpoint is unreachable.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          # ── Readiness probe ──────────────────────────────────────────────────
          # Delays traffic (Endpoints registration) until the app is ready.
          # The indexer has no inbound traffic but the probe confirms DB + RPC
          # connectivity before the pod is considered healthy.
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
          # ── Startup probe ────────────────────────────────────────────────────
          # Gives the container up to 90s to start (3 * 30s) before the
          # liveness probe kicks in. Handles cold-start DB migrations.
          startupProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 9
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # Node.js writes temp files
            capabilities:
              drop:
                - ALL
      # Only schedule on Linux nodes.
      nodeSelector:
        kubernetes.io/os: linux
      # Tolerate NoSchedule taints on dedicated backend nodes (optional).
      # Uncomment and adjust if you use node taints for workload isolation.
      # tolerations:
      #   - key: "dedicated"
      #     operator: "Equal"
      #     value: "backend"
      #     effect: "NoSchedule"
