# deploy/k8s/hpa.yaml
#
# Horizontal Pod Autoscaler for the SorobanPay API.
#
# Scales between 2 (min) and 10 (max) replicas based on CPU utilization.
# Memory scaling is also configured as a secondary signal.
#
# Prerequisites: metrics-server must be installed in the cluster.
#   kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
# To verify HPA is working:
#   kubectl get hpa sorobanpay-api -n sorobanpay
#   kubectl describe hpa sorobanpay-api -n sorobanpay
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: sorobanpay-api
  namespace: sorobanpay
  labels:
    app.kubernetes.io/name: sorobanpay
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: sorobanpay-api
  minReplicas: 2
  maxReplicas: 10
  metrics:
    # Scale up when average CPU across all API pods exceeds 70%.
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    # Secondary signal: scale up when memory exceeds 80% of the limit.
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      # Stabilise for 5 minutes before scaling down to avoid flapping.
      stabilizationWindowSeconds: 300
      policies:
        # Remove at most 1 pod per 60 seconds when scaling down.
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      # React to high load quickly — no stabilization window on scale-up.
      stabilizationWindowSeconds: 0
      policies:
        # Add at most 2 pods per 30 seconds when scaling up.
        - type: Pods
          value: 2
          periodSeconds: 30
        # Or double the current count, whichever is larger.
        - type: Percent
          value: 100
          periodSeconds: 30
      selectPolicy: Max
