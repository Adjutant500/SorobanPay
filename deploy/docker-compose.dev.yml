version: "3.9"

# Local development stack: backend + PostgreSQL + Prometheus + Grafana
# Usage:
#   docker compose -f deploy/docker-compose.dev.yml up
#
# Services:
#   postgres    → localhost:5432
#   backend     → localhost:3001  (Express API + /metrics endpoint)
#   prometheus  → localhost:9090
#   grafana     → localhost:3000  (admin/admin on first launch)

services:

  # ─── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: sorobanpay
      POSTGRES_PASSWORD: sorobanpay
      POSTGRES_DB: sorobanpay
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sorobanpay"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ─── Backend ───────────────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://sorobanpay:sorobanpay@postgres:5432/sorobanpay
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      RPC_URL: ${RPC_URL:-https://soroban-testnet.stellar.org}
      NETWORK_PASSPHRASE: ${NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
      CONTRACT_ID: ${CONTRACT_ID:-CXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXXX}
      PORT: 3001
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-change-me-in-production}
      OTEL_SDK_DISABLED: "true"
      # Cache TTLs (seconds) — override as needed
      CACHE_TTL_SUBSCRIPTIONS: ${CACHE_TTL_SUBSCRIPTIONS:-60}
      CACHE_TTL_ANALYTICS: ${CACHE_TTL_ANALYTICS:-300}
      CACHE_TTL_SUBSCRIPTION_DETAIL: ${CACHE_TTL_SUBSCRIPTION_DETAIL:-30}
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.53.0
    restart: unless-stopped
    depends_on:
      - backend
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.console.libraries=/usr/share/prometheus/console_libraries
      - --web.console.templates=/usr/share/prometheus/consoles
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  # ─── Grafana ───────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:11.1.0
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      # Auto-provision data source (Prometheus)
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      # Auto-provision dashboard provider
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      # Auto-load the SorobanPay dashboard JSON
      - ./grafana/sorobanpay-dashboard.json:/etc/grafana/provisioning/dashboards/sorobanpay-dashboard.json:ro
    ports:
      - "3000:3000"

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
